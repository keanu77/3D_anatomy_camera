name: Verify 3D anatomy camera
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run fetch:models
      - run: npx playwright install --with-deps chromium
      - run: npm run lint && npm test && npm run build && npm run e2e -- $(node scripts/e2e-shard-files.mjs ${{ matrix.shard }})
        env:
          BUILD_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: verification-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
